name: build

on:
  pull_request: {}
  push:
    branches:
      - main

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: SQL database
            path: connect-service/sql
          - name: MQTT sensors
            path: connect-service/mqtt
          - name: Kafka orders
            path: connect-service/kafka-orders
          - name: Artemis queue
            path: connect-service/artemis
          - name: FTP courier
            path: connect-service/ftp
          - name: Camel 1.0 tribute
            path: connect-service/camel-1-tribute
          - name: Order generator
            path: run/order-generator
          - name: Nightly report
            path: run/nightly-report
          - name: Properties and profiles
            path: run/properties-and-profiles
          - name: JSON transform
            path: transform/json-transform
          - name: XML to JSON
            path: transform/xml-to-json
          - name: CSV to JSON
            path: transform/csv-to-json
          - name: Data mapping
            path: transform/data-mapping
          - name: Groovy
            path: transform/groovy
          - name: XSLT
            path: transform/xslt
          - name: Content-based router
            path: route/content-based-router
          - name: Order lines
            path: route/order-lines
          - name: Aggregator
            path: route/aggregator
          - name: Filter and multicast
            path: route/filter-and-multicast
          - name: Error handling
            path: fail-well/error-handling
          - name: Circuit breaker
            path: fail-well/circuit-breaker
          - name: Stock API
            path: connect/stock-api
          - name: HTTP client
            path: connect/http-client
          - name: File processing
            path: connect/file-processing
          - name: OpenAPI server
            path: rest/openapi-server
          - name: OpenAPI client
            path: rest/openapi-client
          - name: AWS SQS
            path: cloud/aws-sqs
          - name: EDI X12 AS2
            path: transformation/edi-x12-as2
          - name: Smart log analyzer
            path: ai/smart-log-analyzer/first-iteration
      fail-fast: false
    name: ${{ matrix.name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/*.camel.yaml') }}
          restore-keys: ${{ runner.os }}-m2-
      - name: Cache SDKMAN and JBang
        id: cache-sdkman
        uses: actions/cache@v4
        with:
          path: ~/.sdkman
          key: ${{ runner.os }}-sdkman-jbang
      - name: Install JBang
        if: steps.cache-sdkman.outputs.cache-hit != 'true'
        run: |
          curl -s "https://get.sdkman.io" | bash
          source "/home/runner/.sdkman/bin/sdkman-init.sh"
          sdk install jbang
      - name: Setup JBang
        run: |
          source "/home/runner/.sdkman/bin/sdkman-init.sh"
          jbang --version

          jbang trust add https://github.com/apache/camel/

          jbang camel@apache/camel --version
          jbang camel@apache/camel plugin add test
      - name: Run tests
        env:
          CITRUS_CAMEL_JBANG_DUMP_INTEGRATION_OUTPUT: "true"
          CITRUS_TESTCONTAINERS_REGISTRY_MIRROR_ENABLED: "true"
          CITRUS_TESTCONTAINERS_REGISTRY_MIRROR: "mirror.gcr.io"
        run: |
          source "/home/runner/.sdkman/bin/sdkman-init.sh"
          jbang camel@apache/camel test run ${{ matrix.path }}/test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dumps-${{ strategy.job-index }}
          include-hidden-files: true
          path: |
            **/.citrus-jbang/*-output.txt
