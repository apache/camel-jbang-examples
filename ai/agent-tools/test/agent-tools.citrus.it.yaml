name: agent-tools-test
description: A local model answers the customers' questions with the shop's route tools
actions:
  - camel:
      infra:
        run:
          service: ollama
          # a side port, so an Ollama already installed on the machine does not get in the way
          port: 11435
  # the container pulls the model after it starts; wait until Ollama lists it
  - repeatOnError:
      until: i >= 60
      index: i
      autoSleep: 5000
      actions:
        - http:
            client: "http://localhost:11435"
            sendRequest:
              GET:
                path: "/api/tags"
        - http:
            client: "http://localhost:11435"
            receiveResponse:
              response:
                status: "200"
              validate:
                - jsonPath:
                    - expression: "$.models[?(@.name=='granite4:3b')].name"
                      value: "granite4:3b"
  - camel:
      cli:
        run:
          integration:
            name: "agent-tools"
            file: "../agent-tools.camel.yaml"
            # the properties file would win over an inline property, so all of them are given here
            systemProperties:
              properties:
                - name: openai.base.url
                  value: http://localhost:11435/v1
                - name: openai.model
                  value: granite4:3b
                - name: openai.api.key
                  value: ollama
          resources:
            - "questions/question-1.txt"
            - "questions/question-2.txt"
            - "questions/question-3.txt"
            - "stock.json"
            - "orders/order-1001.json"
            - "orders/order-1002.json"
            - "orders/order-1003.json"
  # the model asked the shop: each question calls at least one tool before its answer
  - camel:
      cli:
        verify:
          integration: "agent-tools"
          logMessage: "Tool order_status(ORD-1003)"
  - camel:
      cli:
        verify:
          integration: "agent-tools"
          logMessage: "Answer question-3:"
