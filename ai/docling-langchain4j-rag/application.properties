# Application Configuration
camel.main.name = DoclingLangChain4jRAG

# Directory Configuration
documents.directory=documents
output.directory=output

# Docling-Serve Configuration
# Can be run via: docker run -p 5001:5001 ghcr.io/docling-project/docling-serve:latest
# Or via: camel infra run docling (if available)
docling.serve.url=http://localhost:5001

# Ollama Configuration
ollama.base.url=http://localhost:11434
ollama.model.name=granite4:3b

# Batch Processing Configuration
# The batch summary of everything in the documents directory: first run after ten seconds, then hourly
batch.delay=10000
batch.period=3600000

# HTTP Server Configuration
camel.server.port=8080

# the folders the routes read and write hold data, not sources: with camel run --source-dir in dev mode,
# a change in them does not reload the routes
camel.jbang.dataDir=documents,output

# the chat model of the langchain4j-chat endpoints, by provider: camel run downloads langchain4j-ollama for it
camel.component.langchain4j-chat.provider=ollama
camel.component.langchain4j-chat.base-url={{ollama.base.url}}
camel.component.langchain4j-chat.model-name={{ollama.model.name}}
camel.component.langchain4j-chat.temperature=0.3
