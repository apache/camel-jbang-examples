# The broker started by: camel infra run artemis
camel.beans.artemisCF = #class:org.apache.activemq.artemis.jms.client.ActiveMQConnectionFactory
camel.beans.artemisCF.brokerURL = tcp://localhost:61616
camel.beans.artemisCF.user = artemis
camel.beans.artemisCF.password = artemis
camel.component.jms.connection-factory = #bean:artemisCF

# the folders the routes read and write hold data, not sources: with camel run --source-dir in dev mode,
# a change in them does not reload the routes
camel.jbang.dataDir=outbox
